<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Drag pushes the chain ahead of you; holding still slots the block in between</title>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#111" opacity="0.13"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#111"/>
    </marker>
    <!-- one block: hard shadow, fill, label -->
    <symbol id="A" viewBox="0 0 150 46" width="150" height="46"><rect x="5" y="5" width="145" height="41" fill="#111"/><rect x="1.5" y="1.5" width="143" height="39" fill="#b69cff" stroke="#111" stroke-width="3"/><text x="16" y="28" font-size="18" font-weight="900" fill="#111">A</text></symbol>
    <symbol id="B" viewBox="0 0 150 46" width="150" height="46"><rect x="5" y="5" width="145" height="41" fill="#111"/><rect x="1.5" y="1.5" width="143" height="39" fill="#4d96ff" stroke="#111" stroke-width="3"/><text x="16" y="28" font-size="18" font-weight="900" fill="#111">B</text></symbol>
    <symbol id="C" viewBox="0 0 150 46" width="150" height="46"><rect x="5" y="5" width="145" height="41" fill="#111"/><rect x="1.5" y="1.5" width="143" height="39" fill="#3ddc97" stroke="#111" stroke-width="3"/><text x="16" y="28" font-size="18" font-weight="900" fill="#111">C</text></symbol>
    <symbol id="D" viewBox="0 0 150 46" width="150" height="46"><rect x="5" y="5" width="145" height="41" fill="#111"/><rect x="1.5" y="1.5" width="143" height="39" fill="#ffd23f" stroke="#111" stroke-width="3"/><text x="16" y="28" font-size="18" font-weight="900" fill="#111">D</text><text x="132" y="28" text-anchor="end" font-size="13" font-weight="900" fill="#111">✋</text></symbol>
    <symbol id="Dslot" viewBox="0 0 150 46" width="150" height="46"><rect x="5" y="5" width="145" height="41" fill="#111"/><rect x="1.5" y="1.5" width="143" height="39" fill="#ffd23f" stroke="#111" stroke-width="3" stroke-dasharray="9 5"/><text x="16" y="28" font-size="18" font-weight="900" fill="#111">D</text><text x="132" y="28" text-anchor="end" font-size="13" font-weight="900" fill="#111">✋</text></symbol>
  </defs>

  <rect x="3" y="3" width="1194" height="424" fill="#fff7e0" stroke="#111" stroke-width="6"/>
  <rect x="6" y="6" width="1188" height="418" fill="url(#dots)"/>
  <rect x="597" y="6" width="6" height="418" fill="#111"/>

  <!-- ===== left: push ===== -->
  <g transform="translate(40 0)">
    <rect x="0" y="34" width="232" height="38" fill="#111"/>
    <text x="14" y="60" font-size="20" font-weight="900" letter-spacing="1" fill="#fff">DRAG → PUSH</text>
    <text x="250" y="60" font-size="16" font-weight="700" fill="#5b5647">blocks are solid</text>

    <text x="0" y="90" font-size="13" font-weight="900" letter-spacing="1.5" fill="#5b5647">BEFORE</text>
    <use href="#A" x="0" y="116"/>
    <use href="#B" x="0" y="156"/>
    <use href="#C" x="0" y="196"/>
    <use href="#D" x="0" y="256"/>

    <path d="M200 230 H316" stroke="#111" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="258" y="216" text-anchor="middle" font-size="13" font-weight="900" fill="#111">drag D up</text>

    <text x="356" y="90" font-size="13" font-weight="900" letter-spacing="1.5" fill="#5b5647">AFTER</text>
    <use href="#A" x="356" y="96"/>
    <use href="#B" x="356" y="136"/>
    <use href="#C" x="356" y="176"/>
    <use href="#D" x="356" y="216"/>
    <path d="M524 216 V140" stroke="#111" stroke-width="4" marker-end="url(#arrow)"/>
  </g>
  <text x="40" y="350" font-size="17" font-weight="800" fill="#111">The whole chain moves ahead of D, in order.</text>
  <text x="40" y="376" font-size="17" font-weight="800" fill="#111">Nothing passes through, however fast you drag.</text>
  <text x="40" y="402" font-size="15" font-weight="700" fill="#5b5647">The day's edges and the now-line act as walls.</text>

  <!-- ===== right: slot in ===== -->
  <g transform="translate(640 0)">
    <rect x="0" y="34" width="270" height="38" fill="#ffd23f" stroke="#111" stroke-width="3"/>
    <text x="14" y="60" font-size="20" font-weight="900" letter-spacing="1" fill="#111">HOLD → SLOT IN</text>
    <!-- the hold timer chip -->
    <rect x="290" y="38" width="150" height="30" fill="#111"/>
    <text x="303" y="58" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="900" fill="#fff">hold 0.6s</text>
    <rect x="290" y="64" width="104" height="4" fill="#ffd23f"/>

    <text x="0" y="104" font-size="13" font-weight="900" letter-spacing="1.5" fill="#5b5647">BEFORE</text>
    <use href="#A" x="0" y="116"/>
    <use href="#B" x="0" y="156"/>
    <use href="#C" x="0" y="196"/>
    <use href="#D" x="0" y="256"/>

    <path d="M200 230 H316" stroke="#111" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="258" y="216" text-anchor="middle" font-size="13" font-weight="900" fill="#111">drag, then hold</text>

    <text x="356" y="104" font-size="13" font-weight="900" letter-spacing="1.5" fill="#5b5647">AFTER</text>
    <use href="#A" x="356" y="116"/>
    <use href="#B" x="356" y="156"/>
    <use href="#Dslot" x="356" y="196"/>
    <use href="#C" x="356" y="236"/>
    <path d="M524 214 V258" stroke="#111" stroke-width="4" marker-end="url(#arrow)"/>
  </g>
  <text x="640" y="350" font-size="17" font-weight="800" fill="#111">Hold still mid-drag and D slides through.</text>
  <text x="640" y="376" font-size="17" font-weight="800" fill="#111">The seam nearest its middle opens up.</text>
  <text x="640" y="402" font-size="15" font-weight="700" fill="#5b5647">Hold again to go back to pushing.</text>
</svg>
