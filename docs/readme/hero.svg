<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>iWill: timeboxing with physics</title>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#111" opacity="0.13"/>
    </pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="5" height="10" fill="#111" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- card -->
  <rect x="3" y="3" width="1194" height="454" fill="#fff7e0" stroke="#111" stroke-width="6"/>
  <rect x="6" y="6" width="1188" height="448" fill="url(#dots)"/>

  <!-- logo -->
  <g transform="rotate(-4 250 150)">
    <rect x="72" y="72" width="356" height="150" fill="#111"/>
    <rect x="58" y="58" width="356" height="150" fill="#ffd23f" stroke="#111" stroke-width="7"/>
    <text x="236" y="172" text-anchor="middle" font-size="112" font-weight="900" letter-spacing="-6" fill="#111">iWill<tspan fill="#ff3b3b">.</tspan></text>
  </g>

  <!-- tagline -->
  <text x="60" y="306" font-size="42" font-weight="900" letter-spacing="-1.5" fill="#111">Timeboxing with physics.</text>
  <text x="60" y="350" font-size="22" font-weight="700" fill="#5b5647">Blocks push, slot in and make room for each other.</text>
  <text x="60" y="382" font-size="22" font-weight="700" fill="#5b5647">A Pomodoro that knows which block you're in.</text>
  <g font-size="16" font-weight="900" letter-spacing="1">
    <rect x="60" y="402" width="148" height="30" fill="#111"/>
    <text x="134" y="423" text-anchor="middle" fill="#fff">100% OFFLINE</text>
    <rect x="218" y="402" width="148" height="30" fill="#fffdf5" stroke="#111" stroke-width="3"/>
    <text x="292" y="423" text-anchor="middle" fill="#111">NO ACCOUNTS</text>
  </g>

  <!-- mini timeline -->
  <rect x="660" y="46" width="500" height="380" fill="#111"/>
  <rect x="650" y="36" width="500" height="380" fill="#fffdf5" stroke="#111" stroke-width="5"/>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="900" fill="#5b5647">
    <text x="676" y="85">09:00</text>
    <text x="676" y="185">10:00</text>
    <text x="676" y="285">11:00</text>
    <text x="676" y="385">12:00</text>
  </g>
  <g stroke="#111" opacity="0.15" stroke-width="2">
    <line x1="735" y1="80" x2="1145" y2="80"/>
    <line x1="735" y1="180" x2="1145" y2="180"/>
    <line x1="735" y1="280" x2="1145" y2="280"/>
    <line x1="735" y1="380" x2="1145" y2="380"/>
  </g>
  <rect x="733" y="40" width="4" height="372" fill="#111"/>

  <!-- blocks: lane x 745..1015, flag rail beyond -->
  <g stroke="#111" stroke-width="3">
    <rect x="749" y="84" width="270" height="125" fill="#111"/>
    <rect x="745" y="80" width="270" height="125" fill="#b69cff"/>
    <rect x="749" y="217" width="270" height="63" fill="#111"/>
    <rect x="745" y="213" width="270" height="63" fill="#4d96ff"/>
    <rect x="749" y="309" width="270" height="75" fill="#111"/>
    <rect x="745" y="305" width="270" height="75" fill="#ff8a3d"/>
    <rect x="745" y="305" width="270" height="75" fill="url(#hatch)" stroke="none"/>
  </g>
  <!-- sliver: a 5-minute break -->
  <rect x="745" y="205" width="270" height="8" fill="#3ddc97" stroke="#111" stroke-width="2"/>
  <!-- its pull tab -->
  <rect x="862" y="213" width="36" height="10" fill="#3ddc97" stroke="#111" stroke-width="2.5"/>
  <rect x="872" y="217" width="16" height="2" fill="#111" opacity="0.6"/>
  <!-- its flag -->
  <path d="M1015 209 H1019 L1027 200" fill="none" stroke="#111" stroke-width="2"/>
  <rect x="1029" y="191" width="114" height="22" fill="#111"/>
  <rect x="1027" y="189" width="114" height="22" fill="#3ddc97" stroke="#111" stroke-width="2"/>
  <text x="1035" y="205" font-size="12" font-weight="900" fill="#111">Break</text>
  <text x="1133" y="205" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="11" font-weight="700" fill="#111" opacity="0.8">5m</text>

  <g font-weight="900" fill="#111">
    <text x="757" y="106" font-size="17">Deep work</text>
    <text x="757" y="126" font-family="ui-monospace, Menlo, monospace" font-size="12" opacity="0.75">09:00–10:15 · 1h 15m</text>
    <text x="757" y="238" font-size="17">Standup</text>
    <text x="757" y="257" font-family="ui-monospace, Menlo, monospace" font-size="12" opacity="0.75">10:20–11:00</text>
    <text x="757" y="331" font-size="17" text-decoration="line-through">Run</text>
    <text x="757" y="350" font-family="ui-monospace, Menlo, monospace" font-size="12" opacity="0.75">11:15–12:00 · done</text>
  </g>

  <!-- now line -->
  <rect x="717" y="261" width="14" height="14" fill="#ff3b3b" stroke="#111" stroke-width="3"/>
  <rect x="731" y="266" width="414" height="4" fill="#ff3b3b"/>

  <!-- focus timer chip, in the Standup block's colour, docked on the calendar's corner -->
  <g transform="rotate(4 650 404)">
    <rect x="576" y="368" width="160" height="78" fill="#111"/>
    <rect x="568" y="360" width="160" height="78" fill="#4d96ff" stroke="#111" stroke-width="5"/>
    <rect x="578" y="370" width="58" height="17" fill="#111"/>
    <text x="607" y="383" text-anchor="middle" font-size="11" font-weight="900" letter-spacing="1.5" fill="#fff">FOCUS</text>
    <text x="641" y="425" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="36" font-weight="900" letter-spacing="-2" fill="#111">18:42</text>
    <rect x="714" y="360" width="14" height="78" fill="#111" opacity="0.15"/>
    <rect x="714" y="360" width="14" height="46" fill="#c4dbfe"/>
  </g>
</svg>
